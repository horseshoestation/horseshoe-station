<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Horseshoe Station — Kindle Edition</title>
<style>
@font-face{font-family:'IM Fell English';font-style:normal;font-weight:400;src:url(../fonts/im-fell-english-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IM Fell English';font-style:italic;font-weight:400;src:url(../fonts/im-fell-english-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;src:url(../fonts/eb-garamond-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;src:url(../fonts/eb-garamond-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:600;src:url(../fonts/eb-garamond-latin-600-normal.woff2) format('woff2')}
  *{margin:0;padding:0;box-sizing:border-box}
  #root{height:100%}
  body{background:#f5f2ea;width:1236px;height:1648px;overflow:hidden;
    font-family:'EB Garamond',serif;color:#1a1a1a}
  /* ---- broadsheet ---- */
  .page{width:100%;height:100%;padding:56px 64px 44px;display:flex;flex-direction:column}
  .rulebox{flex:1;border:3px solid #1a1a1a;outline:2px solid #1a1a1a;outline-offset:-12px;
    padding:44px 56px 36px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .eyebrow{font-size:19px;letter-spacing:.42em;color:#555;font-weight:600;text-transform:uppercase;text-align:center}
  h1{font-family:'IM Fell English',serif;font-weight:400;font-size:64px;letter-spacing:.05em;text-align:center;margin-top:8px}
  .ed{display:flex;justify-content:center;gap:26px;align-items:baseline;margin-top:14px;
    font-size:22px;letter-spacing:.24em;text-transform:uppercase}
  .ed b{font-weight:600}
  .orn{display:flex;align-items:center;gap:20px;margin:26px 0}
  .orn::before,.orn::after{content:"";flex:1;border-top:2px solid #1a1a1a}
  .orn span{font-size:22px}
  .glassrow{display:flex;align-items:center;gap:40px}
  .gv{font-family:'IM Fell English',serif;font-size:150px;line-height:.95}
  .gmeta{flex:1}
  .gmeta .t{font-size:30px;letter-spacing:.2em;font-weight:600;text-transform:uppercase}
  .gmeta .v{font-style:italic;font-size:27px;margin-top:10px;line-height:1.45}
  .gmeta .u{font-size:20px;letter-spacing:.14em;color:#555;margin-top:12px;text-transform:uppercase}
  .dscale{margin-top:26px}
  .rose-wrap{display:flex;align-items:center;gap:48px;margin-top:34px}
  .rose-wrap svg.rose{width:400px;height:400px;flex:0 0 auto}
  .today{flex:1}
  .today .k{font-size:20px;letter-spacing:.3em;color:#555;font-weight:600;text-transform:uppercase}
  .today .big{font-family:'IM Fell English',serif;font-size:76px;line-height:1.05;margin-top:10px}
  .today .big .lo{color:#555}
  .today .sub{font-size:27px;line-height:1.7;margin-top:14px}
  .today .sub b{font-weight:600}
  .ledger{margin-top:30px;border-top:2px solid #1a1a1a;padding-top:8px}
  .lrow{display:flex;align-items:baseline;font-size:26px;padding:9px 0;border-bottom:1px dotted #999}
  .lrow .dots{flex:1;margin:0 12px;border-bottom:2px dotted #999;transform:translateY(-6px)}
  .lrow .v{font-weight:600}
  .foot{margin-top:auto;padding-top:22px;border-top:2px solid #1a1a1a;
    display:flex;justify-content:space-between;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:#333}
  /* ---- journal ---- */
  .jpage{width:100%;height:100%;padding:100px 130px 80px;display:flex;flex-direction:column}
  .runhead{display:flex;justify-content:space-between;align-items:baseline;
    font-size:21px;letter-spacing:.28em;text-transform:uppercase;color:#444;
    border-bottom:2px solid #1a1a1a;padding-bottom:14px}
  .dateline{text-align:center;margin-top:70px}
  .dateline .d{font-family:'IM Fell English',serif;font-size:46px;line-height:1.35}
  .dateline .sub{font-size:24px;letter-spacing:.26em;text-transform:uppercase;color:#555;margin-top:18px}
  .jorn{text-align:center;font-size:24px;margin:42px 0 0;letter-spacing:.6em;color:#333}
  .prose{margin-top:52px;font-size:30px;line-height:1.74;text-align:justify}
  .prose p+p{text-indent:2.2em;margin-top:10px}
  .prose b{font-weight:600}
  .closer{margin-top:36px;text-align:center;font-family:'IM Fell English',serif;font-style:italic;font-size:31px}
  .moonrow{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:26px}
  .moonrow svg{width:64px;height:64px}
  .moonrow .m{font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:#333}
  .aside{text-align:center;margin-top:26px}
  .aside .rule{width:34%;border-top:2px solid #1a1a1a;margin:0 auto 20px}
  .aside .inst{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#444;line-height:2.05}
  .pageno{text-align:center;font-size:24px;margin-top:26px;letter-spacing:.4em;color:#333}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
var DATA = __DATA__;
var root = document.getElementById("root");
function esc(s){return String(s);}

function roseSVG(petals, curdir){
  var NS="http://www.w3.org/2000/svg", cx=120, cy=120, out="";
  function P(r,d){var a=d*Math.PI/180;return [cx+r*Math.sin(a),cy-r*Math.cos(a)];}
  function path(d,f,s){return '<path d="'+d+'" fill="'+f+'"'+(s?' stroke="#1a1a1a" stroke-width="1"':'')+'/>';}
  function tri(p,f,s){return path("M"+p.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" L")+" Z",f,s);}
  out+='<circle cx="120" cy="120" r="104" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>';
  out+='<circle cx="120" cy="120" r="99" fill="none" stroke="#1a1a1a" stroke-width="0.7"/>';
  for(var d=0;d<360;d+=5){
    var len=(d%45===0)?0:(d%15===0?6:3.4); if(!len)continue;
    var p1=P(99,d),p2=P(99-len,d);
    out+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#1a1a1a" stroke-width="'+(d%15===0?1.1:0.6)+'"/>';
  }
  var maxN=Math.max.apply(null,petals)||1;
  petals.forEach(function(s,i){
    if(!s)return;
    var ang=i*22.5,half=8.5,r=40+(96-40)*(s/maxN);
    var a1=P(r,ang-half),a2=P(r,ang+half);
    out+='<path d="M'+cx+','+cy+' L'+a1[0].toFixed(1)+','+a1[1].toFixed(1)+' A'+r+','+r+' 0 0 1 '+a2[0].toFixed(1)+','+a2[1].toFixed(1)+' Z" fill="#8a8578" fill-opacity=".5" stroke="#6b6455" stroke-width="1"/>';
  });
  for(var i=1;i<16;i+=2){var ang=i*22.5;out+=tri([P(56,ang),P(7,ang-90),P(7,ang+90)],"#f5f2ea",true);}
  [45,135,225,315].forEach(function(ang){
    var t=P(74,ang),l=P(10,ang-90),r=P(10,ang+90),c=[cx,cy];
    out+=tri([t,l,c],"#6b6455")+tri([t,r,c],"#f5f2ea",true);
  });
  [0,90,180,270].forEach(function(ang){
    var t=P(92,ang),l=P(12,ang-90),r=P(12,ang+90),c=[cx,cy];
    out+=tri([t,l,c],"#1a1a1a")+tri([t,r,c],"#f5f2ea",true);
  });
  out+='<circle cx="120" cy="120" r="5" fill="#f5f2ea" stroke="#1a1a1a" stroke-width="1.4"/>';
  var t2=P(101,curdir),tl=P(16,curdir+180),wl=P(5,curdir-90),wr=P(5,curdir+90);
  out+=tri([t2,wl,tl,wr],"#1a1a1a");
  [["N",0],["E",90],["S",180],["W",270]].forEach(function(t){
    var p=P(115,t[1]);
    out+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+5).toFixed(1)+'" text-anchor="middle" font-size="15" fill="#1a1a1a" font-family="IM Fell English,serif">'+t[0]+'</text>';
  });
  return '<svg class="rose" viewBox="0 0 240 240">'+out+'</svg>';
}

function dutchScale(seg){
  var labs=["STORM","REGEN","VERANDERLYK","MOOI WEER","BESTENDIG"];
  var out='<svg viewBox="0 0 1060 44" width="100%">';
  out+='<line x1="0" y1="30" x2="1060" y2="30" stroke="#1a1a1a" stroke-width="2"/>';
  for(var i=0;i<=5;i++){var x=i*212;out+='<line x1="'+x+'" y1="24" x2="'+x+'" y2="36" stroke="#1a1a1a" stroke-width="2"/>';}
  labs.forEach(function(L,i){
    out+='<text x="'+(106+i*212)+'" y="16" text-anchor="middle" font-family="EB Garamond,serif" font-size="'+(i===seg.i?21:19)+'" letter-spacing="4" font-weight="600" fill="'+(i===seg.i?'#1a1a1a':'#555')+'">'+L+'</text>';
  });
  out+='<path d="M'+seg.x+',30 L'+(seg.x+12)+',42 L'+(seg.x-12)+',42 Z" fill="#1a1a1a"/>';
  return out+'</svg>';
}

function moonSVG(illum, waxing){
  var ph=illum/100, rt=(40*Math.abs(1-2*ph)).toFixed(1), dark;
  if(waxing){ dark='M50,10 A40,40 0 0 0 50,90 A'+rt+',40 0 0 '+(ph<0.5?0:1)+' 50,10 Z'; }
  else { dark='M50,10 A40,40 0 0 1 50,90 A'+rt+',40 0 0 '+(ph<0.5?1:0)+' 50,10 Z'; }
  return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#f5f2ea" stroke="#1a1a1a" stroke-width="3"/><path d="'+dark+'" fill="#1a1a1a"/></svg>';
}

if(DATA.kind==="broadsheet"){
  var b=DATA.b;
  root.innerHTML='<div class="page"><div class="rulebox">'
    +'<div class="eyebrow">The Weather Log of Horseshoe Pl &middot; Nederland, Colorado</div>'
    +'<h1>HORSESHOE STATION</h1>'
    +'<div class="ed"><span>&#10022;</span><b>'+b.edition+'</b><span>&middot;</span><span>'+b.date+'</span><span>&middot;</span><span>set at '+b.setat+'</span><span>&#10022;</span></div>'
    +'<div class="orn"><span>&#10022;</span></div>'
    +'<div class="glassrow"><div class="gv">'+b.glass.val+'</div>'
    +'<div class="gmeta"><div class="t">'+b.glass.head+'</div><div class="v">'+b.glass.verdict+'</div><div class="u">'+b.glass.unit+'</div></div></div>'
    +'<div class="dscale">'+dutchScale(b.seg)+'</div>'
    +'<div class="rose-wrap">'+roseSVG(DATA.petals,DATA.curdir)
    +'<div class="today"><div class="k">'+b.today.label+'</div><div class="big">'+b.today.big+'</div><div class="sub">'+b.today.line1+'</div></div></div>'
    +'<div class="ledger">'+b.rows.map(function(r){return '<div class="lrow"><span>'+r[0]+'</span><span class="dots"></span><span class="v">'+r[1]+'</span></div>';}).join('')+'</div>'
    +'<div class="foot"><span>39.969&deg; N &middot; 105.495&deg; W &middot; 8,373 feet above the sea</span><span>'+b.nextline+'</span></div>'
    +'</div></div>';
}else{
  var j=DATA.j;
  root.innerHTML='<div class="jpage">'
    +'<div class="runhead"><span>From the journal kept at Horseshoe Place</span><span>8,373 feet</span></div>'
    +'<div class="dateline"><div class="d">'+j.dateline+'</div><div class="sub">'+j.subline+'</div></div>'
    +'<div class="jorn">&#10022;&nbsp;&#10022;&nbsp;&#10022;</div>'
    +'<div class="prose">'+j.paras.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>'
    +'<div class="closer">'+j.closer+'</div>'
    +'<div class="moonrow">'+moonSVG(DATA.moonillum,DATA.moonwax)+'<div class="m">'+j.moonline+'</div></div>'
    +'<div class="aside"><div class="rule"></div><div class="inst">'+j.recordline+'</div></div>'
    +'<div class="pageno">&mdash; '+j.nextline+' &mdash;</div>'
    +'</div>';
}
})();
</script>
</body>
</html>
