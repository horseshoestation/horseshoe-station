<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horseshoe Station — The Ship's Glass · LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Ship's Glass live · Spectra-6 palette:
     ink #1a1a1a · paper #f2efe6 · red #c0392b · blue #2e5f94 · yellow #d4a017 · green #2e7d4f */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:18px 10px;
    background:
      radial-gradient(1000px 700px at 78% 6%, rgba(255,214,150,.14) 0%, transparent 55%),
      repeating-linear-gradient(90deg,#2a1d14 0 3px,#33241a 3px 90px,#2c1f15 90px 93px,#362619 93px 180px),
      #2c1f15;
    font-family:'EB Garamond',serif;
  }
  .panel{
    width:min(96vw, 170vh);aspect-ratio:800/480;background:#f2efe6;
    box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 0 1px #d0cab8;
    position:relative;color:#1a1a1a;overflow:hidden;
    display:flex;flex-direction:column;padding:1.6% 2%;
    user-select:none;-webkit-user-select:none;cursor:pointer;
  }
  .rulebox{
    flex:1;display:flex;flex-direction:column;min-height:0;
    border:1.5px solid #1a1a1a;outline:1px solid #1a1a1a;outline-offset:-5px;
    padding:1.8% 3% 1.5%;overflow:hidden;
  }
  .rulebox.warned{border-color:#c0392b;outline-color:#c0392b}
  .hdr{text-align:center;position:relative}
  .eyebrow{font-size:clamp(7px,1.2vw,9.5px);letter-spacing:.42em;color:#2e5f94;font-weight:600;text-transform:uppercase}
  h1{font-family:'IM Fell English',serif;font-weight:400;font-size:clamp(15px,3vw,24px);letter-spacing:.06em;line-height:1.1;margin-top:.3%}
  .hdr .sub{font-size:clamp(7.5px,1.35vw,10.5px);letter-spacing:.22em;margin-top:.6%;text-transform:uppercase}
  .hdr .sub b{color:#c0392b;font-weight:600}
  .hdr .date{position:absolute;top:2px;right:0;font-size:clamp(7.5px,1.3vw,10px);letter-spacing:.14em;text-align:right;line-height:1.7}
  .orn{display:flex;align-items:center;gap:10px;margin:1% 0 1.2%}
  .orn::before,.orn::after{content:"";flex:1;border-top:1px solid #1a1a1a}
  .orn span{font-size:clamp(8px,1.4vw,11px);color:#c0392b;line-height:1;letter-spacing:.2em}
  #content{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .foot{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:1.4%;padding-top:1.3%;border-top:1px solid #1a1a1a;
    font-size:clamp(6.5px,1.15vw,9px);letter-spacing:.16em;text-transform:uppercase;
  }
  .foot .sun b{color:#d4a017}
  .foot .pages{letter-spacing:.3em}
  .foot .stat-ok{color:#2e7d4f}.foot .stat-bad{color:#c0392b}
  /* shared bits */
  .lbl{font-size:clamp(6.5px,1.15vw,9px);letter-spacing:.3em;color:#2e5f94;font-weight:600;text-transform:uppercase}
  .lbl .u{color:#c0392b}
  .bigword{font-family:'IM Fell English',serif;font-size:clamp(26px,5vw,42px);line-height:1;margin-top:2%}
  .bigword small{font-family:'EB Garamond',serif;font-size:35%}
  .chip{display:inline-block;margin-top:3%;padding:2px 10px;border:1px solid #1a1a1a;border-radius:999px;
    font-size:clamp(7px,1.3vw,10px);letter-spacing:.22em;text-transform:uppercase;font-weight:600}
  .mini{font-size:clamp(7.5px,1.35vw,10.5px);line-height:1.9;margin-top:3%}
  .mini b{font-weight:600}
  .rd{color:#c0392b;font-weight:600}.bl{color:#2e5f94;font-weight:600}.gd{color:#8a6a10;font-weight:600}.gn{color:#2e7d4f;font-weight:600}
  .main3{display:flex;gap:3.4%;flex:1;min-height:0;overflow:hidden}
  .col{display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .colrose{align-items:center}
  .colrose svg{flex:1 1 auto;min-height:0;width:100%}
  .rose-cap{font-size:clamp(6.5px,1.1vw,8.5px);letter-spacing:.14em;text-align:center;margin-top:1%;line-height:1.6;text-transform:uppercase;flex:0 0 auto}
  .rose-cap b{color:#c0392b;font-weight:600}
  .rose-cap i{font-style:normal;font-weight:600}
  .ledger{margin-top:2%;flex:0 1 auto;min-height:0}
  .lrow{display:flex;align-items:baseline;font-size:clamp(8px,1.5vw,11.5px);letter-spacing:.04em;padding:1% 0;border-bottom:1px dotted #b7ae97}
  .lrow .k{white-space:nowrap}
  .lrow .dots{flex:1;margin:0 6px;border-bottom:1px dotted #b7ae97;transform:translateY(-3px)}
  .lrow .v{white-space:nowrap;font-weight:600}
  .lrow .v small{font-weight:400;font-size:85%}
  .remarks{font-style:italic;font-size:clamp(7.5px,1.35vw,10.5px);line-height:1.5;margin-top:1.5%}
  .remarks b{font-style:normal;font-weight:600;letter-spacing:.14em;color:#2e5f94;font-size:88%}
  .glass-val{font-family:'IM Fell English',serif;font-size:clamp(28px,5.6vw,45px);line-height:1;margin-top:3%}
  .glass-unit{font-size:clamp(7.5px,1.3vw,10px);letter-spacing:.1em;margin-top:2%}
  .glass-trend{margin-top:4%;font-weight:600;letter-spacing:.14em;font-size:clamp(8px,1.5vw,11.5px);text-transform:uppercase}
  .glass-trend .arr{font-size:clamp(11px,2vw,16px);vertical-align:-1px}
  .t-fall{color:#c0392b}.t-rise{color:#2e5f94}.t-steady{color:#8a6a10}
  .tracebox svg{display:block;width:100%;height:auto}
  .dscale svg{display:block;width:100%;height:auto}
  .week{display:flex;flex:1;min-height:0;margin-top:1%}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;border-left:1px dotted #b7ae97;padding:1% .4% 0;min-width:0}
  .day:first-child{border-left:none}
  .day .dn{font-weight:600;letter-spacing:.2em;font-size:clamp(8px,1.5vw,11.5px)}
  .day.today .dn{color:#c0392b}
  .day .dt{font-size:clamp(7px,1.2vw,9px);color:#6b6455;letter-spacing:.12em;margin-top:1px}
  .day svg{width:60%;max-width:44px;height:auto;margin:8% 0 6%}
  .day .hi{font-family:'IM Fell English',serif;font-size:clamp(13px,2.6vw,21px);line-height:1}
  .day .lo{font-size:clamp(8px,1.5vw,11.5px);color:#2e5f94;font-weight:600;margin-top:2px}
  .day .pp{font-size:clamp(7px,1.25vw,9.5px);color:#2e5f94;margin-top:6%}
  .day .wd{font-size:clamp(6.5px,1.1vw,8.5px);color:#6b6455;letter-spacing:.08em;margin-top:2px}
  .warncenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
  .stationstrip{border:1px solid #1a1a1a;padding:1.1% 2.4%;display:flex;justify-content:space-between;align-items:baseline;
    font-size:clamp(6.5px,1.2vw,9.5px);letter-spacing:.16em;text-transform:uppercase}
  .splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .splash .s1{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(14px,2.6vw,21px)}
  .splash .s2{margin-top:2%;font-size:clamp(8px,1.5vw,11px);letter-spacing:.2em;text-transform:uppercase;color:#2e5f94}
  .demobadge{position:absolute;top:8px;left:10px;background:#d98f9c;color:#1a1a1a;font-size:10px;letter-spacing:.18em;padding:2px 8px;border-radius:3px;z-index:5;font-weight:600}
  /* Held to the frame's 800x480 on a phone, the panel comes out about 370x222 —
     and every clamp() in here bottoms out on its px floor at that size, so the
     columns need more height than they are given and .col{overflow:hidden}
     quietly eats whatever sits last: the glass remark, the trend, the bottom
     rows of the deck log. Let the frame stand a little taller in the hand. */
  @media (max-aspect-ratio: 1/1){
    .panel{aspect-ratio:auto;height:min(94vh,78vw)}
  }
  /* Turned sideways there is no spare height left to give, so the trace yields
     a little instead of the columns losing their last line. */
  @media (min-aspect-ratio: 1/1) and (max-height: 520px){
    .tracebox svg{max-height:15vh}
  }
</style>

<body>
<div class="panel" id="panel">
  <div class="demobadge" id="demobadge" style="display:none">DEMO &middot; STATION UNREACHABLE</div>
  <div class="rulebox" id="rulebox">
    <div class="hdr">
      <div class="eyebrow">Weather Log &amp; Ship&rsquo;s Glass &middot; LIVE</div>
      <h1>HORSESHOE STATION</h1>
      <div class="sub">Nederland, Colorado &mdash; <b>8,373 feet above the sea</b></div>
      <div class="date" id="hdrdate">&mdash;<br>&mdash;</div>
    </div>
    <div class="orn"><span id="orntitle">&#10022;</span></div>
    <div id="content"><div class="splash"><div class="s1">Reading the flow&hellip;</div><div class="s2" id="splashnote">raising the station on Horseshoe Pl</div></div></div>
    <div class="foot">
      <span>Lat 39.969&deg; N &middot; Long 105.495&deg; W</span>
      <span class="pages" id="dots"></span>
      <span><span id="statnote" class="stat-ok">&mdash;</span> &nbsp;<span class="sun" id="suntimes"></span></span>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
/* ================= CONFIG ================= */
var CFG = {
  apiKey: "",
  appKey: "",
  mac: "34:5F:45:66:8E:40",
  lat: 39.9693, lon: -105.4951,
  tz: "America/Denver",
  pageSeconds: 20,            // auto-advance in browser
  histCalls: 5                // 5 x 288 records x 2min = ~48h
};
/* keys may also arrive in the URL fragment (never sent to any server):
   ...horseshoe_live.html#apiKey=XXX&appKey=YYY&mac=ZZ:ZZ:...   */
(function(){
  try{
    var h=location.hash.replace(/^#/,"");
    if(h){
      h.split("&").forEach(function(kv){
        var p=kv.split("=");
        if(p[0]==="apiKey"&&p[1])CFG.apiKey=decodeURIComponent(p[1]);
        if(p[0]==="appKey"&&p[1])CFG.appKey=decodeURIComponent(p[1]);
        if(p[0]==="mac"&&p[1])CFG.mac=decodeURIComponent(p[1]);
      });
    }
  }catch(e){}
})();
var INK="#1a1a1a", PAPER="#f2efe6", RED="#c0392b", BLUE="#2e5f94", GOLD="#d4a017", GREEN="#2e7d4f", DIM="#6b6455", GRID="#c9c2ae";
var DIRS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];

/* ================= STATE ================= */
var S = {
  cur:null, hist:[], neighbors:null,   // AWN: lastData, records oldest->newest; the chart's company
  nws:null, alerts:[],         // forecast periods, active alerts
  aqi:null,                    // {us_aqi, pm2_5, pm10}
  demo:false, lastTurn:null, errors:{}
};

/* ================= HELPERS ================= */
function $(id){ return document.getElementById(id); }
function fmtT(ms,opts){ return new Date(ms).toLocaleString([], Object.assign({timeZone:CFG.tz}, opts)); }
function dirName(d){ return DIRS[Math.round(d/22.5)%16]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function beaufort(mph){
  if(mph<1)return["0","calm"];if(mph<4)return["1","light air"];if(mph<8)return["2","light breeze"];
  if(mph<13)return["3","gentle breeze"];if(mph<19)return["4","moderate"];if(mph<25)return["5","fresh breeze"];
  if(mph<32)return["6","strong breeze"];if(mph<39)return["7","near gale"];if(mph<47)return["8","gale"];
  if(mph<55)return["9","strong gale"];if(mph<64)return["10","storm"];return["11","violent storm"];
}
/* sun times (NOAA-style approximation) */
function sunTimes(d){
  function calc(rise){
    var lngHour=CFG.lon/15, N=Math.floor((d-new Date(Date.UTC(d.getUTCFullYear(),0,0)))/864e5);
    var t=N+((rise?6:18)-lngHour)/24, M=(0.9856*t)-3.289;
    var L=M+(1.916*Math.sin(M*Math.PI/180))+(0.020*Math.sin(2*M*Math.PI/180))+282.634; L=(L+360)%360;
    var RA=Math.atan(0.91764*Math.tan(L*Math.PI/180))*180/Math.PI; RA=(RA+360)%360;
    RA=(RA+((Math.floor(L/90)*90)-(Math.floor(RA/90)*90)))/15;
    var sinDec=0.39782*Math.sin(L*Math.PI/180), cosDec=Math.cos(Math.asin(sinDec));
    var cosH=(Math.cos(90.833*Math.PI/180)-(sinDec*Math.sin(CFG.lat*Math.PI/180)))/(cosDec*Math.cos(CFG.lat*Math.PI/180));
    if(cosH>1||cosH<-1)return null;
    var H=(rise?360-Math.acos(cosH)*180/Math.PI:Math.acos(cosH)*180/Math.PI)/15;
    var T=H+RA-(0.06571*t)-6.622, UT=(T-lngHour+24)%24;
    var base=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
    return base+UT*3600e3;
  }
  var rise=calc(true), set=calc(false);
  if(rise&&set&&set<rise) set+=864e5;   // set falls past the UTC midnight — bump to the same local day
  return {rise:rise, set:set};
}
function moonInfo(now){
  var age=((now/864e5+2440587.5)-2451550.1)%29.53059; if(age<0)age+=29.53059;
  var illum=Math.round((1-Math.cos(2*Math.PI*age/29.53059))/2*100);
  var names=[[1.8,"new moon"],[5.5,"waxing crescent"],[9.2,"first quarter"],[12.9,"waxing gibbous"],[16.6,"full moon"],[20.3,"waning gibbous"],[24.1,"last quarter"],[27.7,"waning crescent"],[29.6,"new moon"]];
  var name="new moon"; for(var i=0;i<names.length;i++){ if(age<=names[i][0]){ name=names[i][1]; break; } }
  var toFull=(14.765-age+29.53059)%29.53059;
  return {age:age,illum:illum,name:name,toFull:Math.round(toFull),waxing:age<14.765};
}

/* ================= FETCHERS ================= */
function j(url,opt){
  var ctl=new AbortController();
  var tm=setTimeout(function(){ctl.abort();},15000);
  return fetch(url,Object.assign({signal:ctl.signal},opt||{})).then(function(r){
    clearTimeout(tm);
    if(!r.ok)throw new Error(r.status);
    return r.json();
  },function(e){ clearTimeout(tm); throw e; });
}
function awnBase(){ return "https://rt.ambientweather.net/v1/devices"; }
function awnQ(){ return "applicationKey="+CFG.appKey+"&apiKey="+CFG.apiKey; }

/* AWN allows ~1 request/second — every call goes through this queue:
   >=1300ms spacing, and a patient retry with backoff when a 429 slips through. */
var awnChain=Promise.resolve(), awnLast=0;
function awnJ(url){
  var p=awnChain.catch(function(){}).then(async function(){
    for(var tries=0;;tries++){
      var wait=Math.max(0, awnLast+1300-Date.now());
      if(wait) await sleep(wait);
      awnLast=Date.now();
      try{ return await j(url); }
      catch(e){
        if(String(e.message)==="429" && tries<3){ await sleep(2500*(tries+1)); continue; }
        throw e;
      }
    }
  });
  awnChain=p;
  return p;
}

async function loadAWN(full){
  var devs = await awnJ(awnBase()+"?"+awnQ());
  if(!devs.length) throw new Error("no station");
  S.cur = devs[0].lastData;
  S.errors.awn=null;
  if(S.demo){ S.demo=false; $("demobadge").style.display="none"; }
  if(full){
    var recs=[], endDate=null;
    for(var i=0;i<CFG.histCalls;i++){
      try{
        var u=awnBase()+"/"+encodeURIComponent(CFG.mac)+"?"+awnQ()+"&limit=288"+(endDate?("&endDate="+endDate):"");
        var batch=await awnJ(u);
        if(!batch.length) break;
        recs=recs.concat(batch);
        endDate=batch[batch.length-1].dateutc-60000;
      }catch(e){ break; /* keep whatever history we already have */ }
    }
    if(recs.length>10){ recs.reverse(); S.hist=recs; render(); }
  }
}
async function loadNWS(){
  try{
    if(!S.nwsGrid){
      var p=await j("https://api.weather.gov/points/"+CFG.lat+","+CFG.lon);
      S.nwsGrid=p.properties.forecast;
    }
    var f=await j(S.nwsGrid);
    S.nws=f.properties.periods;
    S.errors.nws=null;
  }catch(e){ S.errors.nws=e.message; }
  try{
    var a=await j("https://api.weather.gov/alerts/active?point="+CFG.lat+","+CFG.lon);
    S.alerts=(a.features||[]).map(function(x){return x.properties;});
    S.errors.alerts=null;
  }catch(e){ S.errors.alerts=e.message; }
}
async function loadSummary(){
  try{ var sm=await j("summary.json?t="+Date.now()); S.fire=sm.fire||null; }catch(e){}
}
// mirror of build.py NEIGHBORS — name, lat, lon, elevation m, elevation ft
var NBR=[["The Divide",40.0128,-105.6440,3630,11906],["Ward",40.0722,-105.5089,2880,9450],
         ["Eldora",39.9472,-105.5828,2710,8890],["Gold Hill",40.0630,-105.4101,2530,8300],
         ["Rollinsville",39.9169,-105.5022,2461,8074],["Boulder",40.0150,-105.2705,1624,5328]];
async function loadNeighbors(){
  try{
    var q="latitude="+NBR.map(function(p){return p[1];}).join(",")
      +"&longitude="+NBR.map(function(p){return p[2];}).join(",")
      +"&elevation="+NBR.map(function(p){return p[3];}).join(",")
      +"&current=temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m"
      +"&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto";
    var a=await j("https://api.open-meteo.com/v1/forecast?"+q);
    var arr=Array.isArray(a)?a:[a];
    S.neighbors=NBR.map(function(p,i){
      var c=(arr[i]&&arr[i].current)||{};
      return {name:p[0], lat:p[1], lon:p[2], elev:p[4], tempf:c.temperature_2m,
              code:c.weather_code, windmph:c.wind_speed_10m,
              gustmph:c.wind_gusts_10m, winddir:c.wind_direction_10m};
    });
  }catch(e){ /* the chart draws with em-dashes */ }
}
async function loadAQI(){
  try{
    var a=await j("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+CFG.lat+"&longitude="+CFG.lon+"&current=us_aqi,pm2_5,pm10&timezone=auto");
    S.aqi=a.current;
    S.errors.aqi=null;
  }catch(e){ S.errors.aqi=e.message; }
}

/* ================= DEMO FALLBACK ================= */
function demoData(){
  var now=Date.now(), recs=[];
  for(var i=1440;i>=0;i--){
    var t=now-i*2*60*1000, h=(now-t)/36e5;
    var rel=+(29.52+0.045*Math.sin(h/24*4*Math.PI+1.1)-0.12*Math.exp(-Math.pow((h-30)/6,2))+0.0025*(48-h)+0.006*Math.sin(h*7.3)).toFixed(3);
    var gust=Math.max(1,6+7*Math.max(0,Math.sin(h/24*2*Math.PI+.4))+30*Math.exp(-Math.pow((h-31)/3.2,2))+2.5*Math.sin(h*2.7));
    var solarH=(function(){var lh=(new Date(t)).getUTCHours()-6+(new Date(t)).getUTCMinutes()/60; lh=(lh+24)%24; var x=(lh-12.6)/6.8; return Math.max(0,Math.cos(x*Math.PI/2))*934*(1-0.35*Math.exp(-Math.pow((lh-15)/1.4,2)));})();
    recs.push({dateutc:t, tempf:61+14*Math.sin(((h%24)/24)*2*Math.PI+3.6), humidity:60, baromrelin:rel,
      windspeedmph:gust*0.5, windgustmph:gust, winddir:(255+18*Math.sin(h*0.9))%360,
      solarradiation:solarH, uv:Math.round(solarH/100), hourlyrainin:0, tempinf:71+9*Math.sin(((h%24)/24)*2*Math.PI+3.4), humidityin:45});
  }
  S.hist=recs;
  var last=recs[recs.length-1];
  S.cur=Object.assign({},last,{feelsLike:last.tempf, dewPoint:48, baromabsin:+(last.baromrelin-7.27).toFixed(3),
    maxdailygust:17.2, dailyrainin:0.12, weeklyrainin:0.15, monthlyrainin:0.76, yearlyrainin:4.57, tz:CFG.tz});
  S.demo=true;
}

/* ================= SVG BUILDERS ================= */
function polar(cx,cy,r,a){ a=a*Math.PI/180; return [cx+r*Math.sin(a),cy-r*Math.cos(a)]; }
function roseSVG(size, stacked){
  var recs=S.hist, cx=120, cy=120;
  var bins=[]; for(var i=0;i<16;i++) bins.push([0,0,0]);
  var total=0;
  recs.forEach(function(p){
    var spd=p.windspeedmph, dir=p.winddir;
    if(spd==null||dir==null||spd<1) return;
    var b=Math.round(dir/22.5)%16, c=spd<10?0:(spd<20?1:2);
    bins[b][c]++; total++;
  });
  var maxT=1; bins.forEach(function(b){ maxT=Math.max(maxT,b[0]+b[1]+b[2]); });
  var s='<svg viewBox="0 0 240 240" style="'+(size||'')+'">';

function seriesPath(recs, key, x0,x1,y0,y1, vmin,vmax, N){
  N=N||110;
  var n=recs.length, pts=[];
  if(!n) return pts;
  function X(i){ return n>1 ? x0+(i/(n-1))*(x1-x0) : x1; }
  function Y(v){ return y1-((v-vmin)/(vmax-vmin))*(y1-y0); }
  // Thin the run by buckets, keeping each bucket's low AND high in time order.
  // Stepping over every nth reading walked straight past the gusts and the
  // sharp falls of the glass — the trace has to keep the extremes it is for.
  var bw=Math.max(1,Math.floor(n/N));
  for(var b=0;b<n;b+=bw){
    var end=Math.min(n,b+bw), loI=-1, hiI=-1, lo=Infinity, hi=-Infinity;
    for(var i=b;i<end;i++){
      var v=recs[i][key]; if(v==null) continue;
      if(v<lo){ lo=v; loI=i; }
      if(v>hi){ hi=v; hiI=i; }
    }
    if(loI<0) continue;
    var first=Math.min(loI,hiI), second=Math.max(loI,hiI);
    pts.push(X(first).toFixed(1)+","+Y(recs[first][key]).toFixed(1));
    if(second!==first) pts.push(X(second).toFixed(1)+","+Y(recs[second][key]).toFixed(1));
  }
  var last=recs[n-1][key];
  if(last!=null) pts.push(x1.toFixed(1)+","+Y(last).toFixed(1));
  return pts;
}

function glyphFor(txt){

function trendOf(){
  var recs=S.hist.filter(function(r){return r.baromrelin!=null;});
  if(recs.length<10) return {cls:"t-steady",arr:"&#8594;",word:"Steady",verdict:"The glass is still filling its memory."};
  var last=recs[recs.length-1].baromrelin;
  var i3=recs.length-1; var t3=recs[recs.length-1].dateutc-3*36e5;
  while(i3>0&&recs[i3].dateutc>t3)i3--;
  var d3=last-recs[i3].baromrelin;
  if(d3>=0.02)return {cls:"t-rise",arr:"&#8599;",word:"Rising"+(d3>=0.06?" fast":""),verdict:"Drier air moving in — a good sign for tomorrow."};
  if(d3<=-0.02)return {cls:"t-fall",arr:"&#8600;",word:"Falling"+(d3<=-0.06?" fast":" slowly"),verdict:d3<=-0.06?"A disturbance approaches — wind and weather within a day.":"Clouds or afternoon storms becoming more likely."};

}

  S.hist.forEach(function(r){ if(r.winddir!=null&&r.windspeedmph>=1){ var n=dirName(r.winddir); counts[n]=(counts[n]||0)+1; if(counts[n]>best){best=counts[n];name=n;} } });
  return name;
}
function pageWind(){
  var c=S.cur, bf=beaufort(c.windspeedmph);
  var maxg=0,maxt=null,sum=0,n=0,gusty=0;
  S.hist.forEach(function(r){
    if(r.windgustmph!=null){ if(r.windgustmph>maxg){maxg=r.windgustmph;maxt=r.dateutc;} if(r.windgustmph>=25)gusty++; }
    if(r.windspeedmph!=null){ sum+=r.windspeedmph; n++; }
  });
  var hrs=(gusty*2/60).toFixed(1);
  return '<div class="main3">'
    +'<div class="col" style="width:27%">'
      +'<div class="lbl">The Wind</div>'
      +'<div class="bigword">'+c.windspeedmph.toFixed(1)+'<small> mph</small></div>'
      +'<div class="chip">'+bf[1]+'</div>'
      +'<div class="mini">gusting <b class="rd">'+c.windgustmph.toFixed(1)+'</b> mph<br>from <b>'+dirName(c.winddir)+'</b> ('+Math.round(c.winddir)+'&deg;)<br>10-min avg <b>'+(c.windspdmph_avg10m!=null?c.windspdmph_avg10m.toFixed(1):"&mdash;")+'</b> mph</div>'
    +'</div>'
    +'<div class="col colrose" style="width:40%">'+roseSVG()
      +'<div class="rose-cap">petal = share of 48 h &middot; stacked: <i style="color:'+BLUE+'">&#9632;</i>&lt;10 <i style="color:'+GOLD+'">&#9632;</i>10&ndash;20 <i style="color:'+RED+'">&#9632;</i>20+ mph</div>'
    +'</div>'

      +'<div class="lbl">The Wind Ledger</div>'

function pageWeek(){
  if(!S.nws) return '<div class="splash"><div class="s1">Raising NWS Boulder&hellip;</div></div>';
  var days={},order=[];
  S.nws.forEach(function(p){
    var d=p.startTime.slice(0,10);
    if(!days[d]){days[d]={};order.push(d);}
    if(p.isDaytime)days[d].day=p; else days[d].night=p;
  });
  var cols='';
  order.slice(0,7).forEach(function(d,i){
    var dd=days[d], day=dd.day, night=dd.night;
    var hi=day?day.temperature:(night?"&mdash;":"");
    var lo=night?night.temperature:"&mdash;";
    var src=day||night;
    var pop=(src.probabilityOfPrecipitation&&src.probabilityOfPrecipitation.value)||0;
    var wd=(src.windDirection||"")+" "+String(src.windSpeed||"").replace(" mph","").split(" to ").pop();
    var dt=new Date(d+"T12:00:00");
    cols+='<div class="day'+(i===0?' today':'')+'">'
      +'<div class="dn">'+dt.toLocaleDateString([],{weekday:"short"}).toUpperCase()+'</div>'
      +'<div class="dt">'+dt.toLocaleDateString([],{month:"short",day:"numeric"}).toUpperCase()+'</div>'
      +glyphSVG(glyphFor(src.shortForecast))
      +'<div class="hi">'+hi+'&deg;</div><div class="lo">'+lo+'&deg;</div>'
      +'<div class="pp">&#9730; '+pop+'%</div>'
      +'<div class="wd">'+wd+'</div>'
      +'</div>';
  });
  var outlook=(S.nws[0]&&S.nws[0].detailedForecast)||"";
  if(outlook.length>140)outlook=outlook.slice(0,137)+"&hellip;";
  return '<div class="week">'+cols+'</div>'
    +'<div class="remarks" style="margin-top:1%"><b>Outlook</b> &mdash; '+esc(outlook)+' <span style="color:'+DIM+'">(NWS Boulder)</span></div>';
}
function todayRecs(){
  var now=new Date(), midLocal=new Date(now.toLocaleDateString("en-US",{timeZone:CFG.tz})+" 00:00:00");
  var mid=midLocal.getTime();
  return S.hist.filter(function(r){return r.dateutc>=mid;});
}
function pageGlasshouse(){
  var c=S.cur;
  var tr=todayRecs().filter(function(r){return r.solarradiation!=null;});
  var maxUV=0; todayRecs().forEach(function(r){ if(r.uv!=null&&r.uv>maxUV)maxUV=r.uv; });
  if(c.uv>maxUV)maxUV=c.uv;
  var kwh=0; tr.forEach(function(r){ kwh+=r.solarradiation*120/3.6e6; });
  var dli=(kwh*3.6*2.04).toFixed(0);
  var st=sunTimes(new Date());
  var curve='';
  if(tr.length>3){
    var maxS=Math.max(400,Math.max.apply(null,tr.map(function(r){return r.solarradiation;})));
    var x0=10,x1=290;
    var rise=st.rise||tr[0].dateutc, set=st.set||tr[tr.length-1].dateutc;
    var pts=[];
    var step=Math.max(1,Math.floor(tr.length/90));
    var plotSolar=function(k){
      var frac=(tr[k].dateutc-rise)/(set-rise);
      var x=x0+frac*(x1-x0), y=120-(tr[k].solarradiation/maxS)*95;
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    };
    for(var b=0;b<tr.length;b+=step){          // keep each bucket's dimmest and
      var e=Math.min(tr.length,b+step);        // brightest, so the burn-through
      var loI=-1,hiI=-1,lo=Infinity,hi=-Infinity;   // peaks survive the thinning
      for(var i=b;i<e;i++){
        var f=(tr[i].dateutc-rise)/(set-rise);
        if(f<0||f>1.02) continue;
        var sv=tr[i].solarradiation; if(sv==null) continue;
        if(sv<lo){ lo=sv; loI=i; }
        if(sv>hi){ hi=sv; hiI=i; }
      }
      if(loI<0) continue;
      var f1=Math.min(loI,hiI), f2=Math.max(loI,hiI);
      plotSolar(f1);
      if(f2!==f1) plotSolar(f2);
    }
    var peak=Math.max.apply(null,tr.map(function(r){return r.solarradiation;}));
    var peakR=tr.filter(function(r){return r.solarradiation===peak;})[0];
    var px=x0+((peakR.dateutc-rise)/(set-rise))*(x1-x0), py=120-(peak/maxS)*95;
    curve='<svg viewBox="0 0 300 150" style="width:100%;height:auto;margin-top:2%">'
      +'<defs><pattern id="gh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="'+GOLD+'" stroke-width="1.6" opacity=".8"/></pattern></defs>'
      +[[800,"FULL ALPINE SUN &#183; 800"],[500,"STRONG &#183; 500"],[200,"OVERCAST &#183; 200"]].map(function(b){
          if(b[0]>maxS)return '';
          var y=120-(b[0]/maxS)*95;
          return '<line x1="10" y1="'+y.toFixed(0)+'" x2="290" y2="'+y.toFixed(0)+'" stroke="'+GRID+'" stroke-width="1" stroke-dasharray="3 3"/><text x="290" y="'+(y-3).toFixed(0)+'" text-anchor="end" font-family="EB Garamond,serif" font-size="8" fill="'+DIM+'" letter-spacing="1">'+b[1]+'</text>';
        }).join('')
      +(pts.length?'<path d="M'+pts[0].split(",")[0]+',120 L'+pts.join(" L")+' L'+pts[pts.length-1].split(",")[0]+',120 Z" fill="url(#gh)" stroke="'+INK+'" stroke-width="1.6"/>':'')
      +'<circle cx="'+px.toFixed(0)+'" cy="'+py.toFixed(0)+'" r="2.8" fill="'+RED+'"/>'
      +'<text x="'+Math.min(240,Math.max(60,px)).toFixed(0)+'" y="'+Math.max(10,py-8).toFixed(0)+'" text-anchor="middle" font-family="EB Garamond,serif" font-size="9" font-weight="600" fill="'+RED+'" letter-spacing="1">PEAK '+Math.round(peak)+'</text>'
      +'<line x1="10" y1="120" x2="290" y2="120" stroke="'+INK+'" stroke-width="1.4"/>'
      +'<text x="10" y="132" font-family="EB Garamond,serif" font-size="8.5" letter-spacing="1">&#9728; '+(st.rise?fmtT(st.rise,{hour:"numeric",minute:"2-digit"}):"")+'</text>'
      +'<text x="290" y="132" text-anchor="end" font-family="EB Garamond,serif" font-size="8.5" letter-spacing="1">'+(st.set?fmtT(st.set,{hour:"numeric",minute:"2-digit"}):"")+' &#9728;</text>'
      +'<text x="150" y="132" text-anchor="middle" font-family="EB Garamond,serif" font-size="8.5" fill="'+DIM+'" letter-spacing="1">W/M&sup2; TODAY</text>'
      +'</svg>';
  } else curve='<div class="remarks">the day&rsquo;s light is still gathering&hellip;</div>';
  var delta=(c.tempinf-c.tempf);
  var burnMin=maxUV>=11?10:maxUV>=8?15:maxUV>=6?25:maxUV>=3?45:60;
  var uvx=Math.min(196,Math.max(4, (maxUV/12)*196));
  var nowx=Math.min(196,Math.max(4,(c.uv/12)*196));
  return '<div class="main3">'
    +'<div class="col" style="flex:0 0 27%">'
      +'<div class="lbl">The Sunroom</div>'
      +'<div class="bigword">'+c.tempinf.toFixed(1)+'<small>&nbsp;&deg;F</small></div>'
      +'<div class="chip" style="border-color:'+GREEN+';color:'+GREEN+'">'+(delta>=0?"+":"")+delta.toFixed(1)+'&deg; vs outdoors</div>'
      +'<div class="ledger" style="margin-top:4%">'
      +lrow("Humidity, in",Math.round(c.humidityin)+'<small>%</small>')
      +lrow("Outdoors",c.tempf.toFixed(1)+'&deg; &middot; '+Math.round(c.humidity)+'<small>%</small>')
      +lrow("Dew point, in",(c.dewPointin!=null?Math.round(c.dewPointin)+"&deg;":"&mdash;"))
      +'</div>'
      +'<div class="remarks">'+(c.tempinf>85?"Getting hot under the glass — crack a vent.":(c.tempinf<40?"Frost risk in the glasshouse — mind the heater.":"The plants are comfortable."))+'</div>'
    +'</div>'
    +'<div class="col" style="flex:1"><div class="lbl">Today&rsquo;s Light</div>'+curve
      +'<div class="remarks"><b>The harvest</b> &mdash; '+kwh.toFixed(1)+' kWh/m&sup2; so far; light for growing: '+dli+' DLI. Tomatoes ask 20&ndash;30.</div>'
    +'</div>'
    +'<div class="col" style="flex:0 0 28%">'
      +'<div class="lbl">The Burning Index</div>'
      +'<svg viewBox="0 0 200 64" style="width:100%;height:auto;margin-top:4%">'
      +'<rect x="2" y="18" width="34" height="16" fill="'+GREEN+'" fill-opacity=".6"/>'
      +'<rect x="36" y="18" width="50" height="16" fill="'+GOLD+'" fill-opacity=".5"/>'
      +'<rect x="86" y="18" width="34" height="16" fill="'+GOLD+'"/>'
      +'<rect x="120" y="18" width="50" height="16" fill="'+RED+'" fill-opacity=".55"/>'
      +'<rect x="170" y="18" width="28" height="16" fill="'+RED+'"/>'
      +'<rect x="2" y="18" width="196" height="16" fill="none" stroke="'+INK+'" stroke-width="1.4"/>'
      +'<g font-family="EB Garamond,serif" font-size="8" fill="'+INK+'" letter-spacing=".5" text-anchor="middle">'
      +'<text x="19" y="45">LOW</text><text x="61" y="45">MODERATE</text><text x="103" y="45">HIGH</text><text x="145" y="45">V. HIGH</text><text x="184" y="45" fill="'+RED+'" font-weight="600">11+</text></g>'
      +'<path d="M'+uvx.toFixed(0)+',16 L'+(uvx-5).toFixed(0)+',7 L'+(uvx+5).toFixed(0)+',7 Z" fill="'+RED+'"/>'
      +'<text x="'+uvx.toFixed(0)+'" y="60" text-anchor="middle" font-family="EB Garamond,serif" font-size="8.5" font-weight="600" fill="'+RED+'" letter-spacing="1">PEAK '+maxUV+'</text>'
      +'<path d="M'+nowx.toFixed(0)+',16 L'+(nowx-5).toFixed(0)+',7 L'+(nowx+5).toFixed(0)+',7 Z" fill="'+INK+'" opacity="'+(Math.abs(nowx-uvx)<8?0:1)+'"/>'
      +'</svg>'
      +'<div class="mini" style="line-height:2.1">now <b>UV '+c.uv+'</b> &middot; solar <b>'+Math.round(c.solarradiation)+'</b> W/m&sup2;<br>fair skin burns in <b>~'+burnMin+' min</b> at peak<br>this height adds <b class="gd">+25%</b> sun</div>'
    +'</div></div>';
}
function pageFire(){
  var c=S.cur, tr=todayRecs();

  tr.forEach(function(r){
    if(r.humidity!=null&&r.humidity<rhMin)rhMin=r.humidity;
    if(r.tempf!=null&&r.tempf>tMax)tMax=r.tempf;
    if(r.windgustmph!=null&&r.windgustmph>gMax)gMax=r.windgustmph;
  });
  if(rhMin>99)rhMin=c.humidity; if(tMax<-90)tMax=c.tempf; gMax=Math.max(gMax,c.maxdailygust||0);
  var daysSinceRain=null;
  if(c.lastRain){ daysSinceRain=Math.floor((Date.now()-new Date(c.lastRain).getTime())/864e5); }

  var score=0;

  score+=(gMax>=40?2:gMax>=25?1:0);

    [rhMin<25,'dry air &lt;25%','RH low today '+Math.round(rhMin)+'%'],

      +'<rect x="2" y="14" width="196" height="14" fill="none" stroke="'+INK+'" stroke-width="1.4"/>'
      +'<path d="M'+mx+',12 L'+(mx-5)+',4 L'+(mx+5)+',4 Z" fill="'+INK+'"/>'
      +'<g font-family="EB Garamond,serif" font-size="7.5" fill="'+INK+'" text-anchor="middle" letter-spacing=".5"><text x="22" y="40">LOW</text><text x="62" y="40">MODER.</text><text x="102" y="40">HIGH</text><text x="142" y="40">V. HIGH</text><text x="180" y="40" fill="'+RED+'" font-weight="600" letter-spacing="0">EXTREME</text></g>'

        ?'<div class="chip" style="border-color:'+RED+';color:'+RED+';margin-top:6%">&#9888; Red Flag Warning</div>'

    +'</div></div>';
}

    {n:'GOLD HILL',e:'8,300',t:nb(3).tempf,g:omGlyph(nb(3).code)},
    {n:'ROLLINSVILLE',e:'8,074',t:nb(4).tempf,g:omGlyph(nb(4).code)},
    {n:'BOULDER',e:'5,328',t:nb(5).tempf,g:omGlyph(nb(5).code)}
  ];
  rows.forEach(function(r,i){
    var y=54+i*21;
    s+='<text x="497" y="'+y+'" '+F+' font-size="9" font-weight="600" letter-spacing="1" fill="'+(r.red?RED:INK)+'">'+r.n+'<tspan font-size="6.3" font-weight="400" letter-spacing="0.5"> &#183; '+r.e+'&#8242;</tspan></text>';
    s+='<line x1="612" y1="'+(y-3)+'" x2="664" y2="'+(y-3)+'" stroke="'+INK+'" stroke-width="0.8" stroke-dasharray="1 3"/>';
    s+=gAt(r.g,668,y-11,13);
    s+='<text x="716" y="'+y+'" text-anchor="end" '+F+' font-size="11.5" font-weight="600" fill="'+(r.red?RED:INK)+'">'+tf(r.t)+'</text>';
  });
  s+='<line x1="497" y1="196" x2="716" y2="196" stroke="'+GRID+'" stroke-width="1"/>';
  s+='<text x="497" y="214" '+F+' font-size="8" font-weight="600" fill="'+BLUE+'" letter-spacing="2">THE WIND NOW</text>';
  s+='<text x="497" y="230" '+F+' font-size="10" font-weight="600" fill="'+INK+'" letter-spacing="0.5">'+dirName(c.winddir)+' '+Math.round(c.windspeedmph)+' &#183; GUSTING '+Math.round(c.windgustmph)+' MPH</text>';
  s+='<text x="497" y="244" '+FI+' font-style="italic" font-size="7.5" fill="'+INK+'">the arrow on the chart flies with the wind</text>';
  var warn=activeWarning(), evt=warn?warn.event:((S.alerts&&S.alerts[0])?S.alerts[0].event:null);
  if(evt){
    var txt=esc(String(evt).toUpperCase()); if(txt.length>34)txt=txt.slice(0,33)+'&#8230;';
    s+='<rect x="497" y="258" width="220" height="24" rx="12" fill="none" stroke="'+RED+'" stroke-width="1.2"/>';
    s+='<text x="607" y="274" text-anchor="middle" '+F+' font-size="8" font-weight="600" fill="'+RED+'" letter-spacing="1.5">'+txt+'</text>';
  } else {
    s+='<rect x="497" y="258" width="220" height="24" rx="12" fill="none" stroke="'+GREEN+'" stroke-width="1.2"/>';
    s+='<text x="607" y="274" text-anchor="middle" '+F+' font-size="8" font-weight="600" fill="'+GREEN+'" letter-spacing="1.5">NO WATCHES POSTED</text>';
  }
  if(S.fire&&S.fire.stage) s+='<text x="607" y="300" text-anchor="middle" '+F+' font-size="8" font-weight="600" fill="'+RED+'" letter-spacing="1">'+esc(S.fire.stage.toUpperCase())+' &#183; BOULDER CO.</text>';
  return s+'</svg>';
}
/* ================= CYCLE & RENDER ================= */
var PAGES=[
  {id:"glass", title:"THE GLASS", fn:pageGlass},
  {id:"wind", title:"THE WIND", fn:pageWind},
  {id:"week", title:"THE WEEK AHEAD", fn:pageWeek},
  {id:"chart", title:"THE CHART", fn:pageChart},
  {id:"glasshouse", title:"THE GLASSHOUSE", fn:pageGlasshouse},
  {id:"almanack", title:"THE ALMANACK", fn:pageAlmanack}
];
var idx=0, holdUntil=0;
function activePages(){
  var p=PAGES.slice();
  var month=new Date().getMonth();          // 0=Jan
  var redflag=S.alerts.some(function(a){return /red flag/i.test(a.event||"");});
  if((month>=4&&month<=9)||redflag)         // fire season May–Oct, or any red flag
    p.splice(4,0,{id:"fire",title:"THE FIRE WATCH",fn:pageFire});
  if(S.aqi&&S.aqi.us_aqi>100) p.push({id:"smoke",title:"THE SMOKE WATCH",fn:pageSmoke});
  return p;
}
function activeWarning(){
  var sev={"Extreme":2,"Severe":1};
  var w=S.alerts.filter(function(a){ return sev[a.severity]!=null && /warning/i.test(a.event||""); });
  w.sort(function(a,b){ return (sev[b.severity]||0)-(sev[a.severity]||0); });
  return w[0]||null;
}
function render(){
  if(!S.cur) return;
  var rb=$("rulebox"), warn=activeWarning();
  $("hdrdate").innerHTML=fmtT(Date.now(),{weekday:"short",day:"numeric",month:"short"}).toUpperCase()+"<br>"+fmtT(Date.now(),{hour:"numeric",minute:"2-digit"});
  var st=sunTimes(new Date());
  $("suntimes").innerHTML='<b>&#9728;</b> '+(st.rise?fmtT(st.rise,{hour:"numeric",minute:"2-digit"}):"")+' &middot; '+(st.set?fmtT(st.set,{hour:"numeric",minute:"2-digit"}):"");
  var sn=$("statnote");
  if(S.demo){ sn.textContent="DEMO"; sn.className="stat-bad"; }
  else if(S.errors.awn){ sn.textContent="STATION LINK LOST"; sn.className="stat-bad"; }
  else { sn.textContent="LIVE · "+fmtT(S.lastTurn||Date.now(),{hour:"numeric",minute:"2-digit"}); sn.className="stat-ok"; }
  if(warn){
    rb.classList.add("warned");
    $("orntitle").innerHTML="&#9888;&nbsp;&nbsp;THE WARNING&nbsp;&nbsp;&#9888;";
    $("content").innerHTML=pageWarning(warn);
    $("dots").innerHTML="&#9888;";
    return;
  }
  rb.classList.remove("warned");
  var pages=activePages(); idx=idx%pages.length;
  var pg=pages[idx];
  $("orntitle").innerHTML="&#10022;&nbsp;&nbsp;"+pg.title+"&nbsp;&nbsp;&#10022;";
  try{ $("content").innerHTML=pg.fn(); }
  catch(e){ $("content").innerHTML='<div class="splash"><div class="s1">This page hit weather of its own.</div><div class="s2">'+esc(e.message)+'</div></div>'; }
  var dots=""; pages.forEach(function(p,i){ dots+=(i===idx?"&#9679; ":"&#9675; "); });
  $("dots").innerHTML=dots.trim();
}
function advance(n){ var pages=activePages(); idx=(idx+n+pages.length)%pages.length; render(); }
$("panel").addEventListener("click",function(e){
  holdUntil=Date.now()+120000;
  advance(e.clientX < window.innerWidth/2 ? -1 : 1);
});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){holdUntil=Date.now()+120000;advance(1);}
  if(e.key==="ArrowLeft"){holdUntil=Date.now()+120000;advance(-1);}
});
setInterval(function(){ if(Date.now()>holdUntil&&S.cur&&!activeWarning()) advance(1); }, CFG.pageSeconds*1000);

/* ================= BOOT ================= */
async function boot(){
  try{
    $("splashnote").textContent="raising the station on Horseshoe Pl";
    await loadAWN(false);          // first paint from current conditions, fast
    S.lastTurn=Date.now();
    render();
    loadAWN(true).catch(function(){});   // 48 h of history fills in behind
  }catch(e){
    S.errors.awn=e.message;
    demoData();
    var db=$("demobadge");
    db.textContent="DEMO · STATION UNREACHABLE — "+(e.name==="AbortError"?"timed out":(e.message||"network blocked"));
    db.style.display="block";
  }
  render();
  loadNWS().then(render);
  loadAQI().then(render);
  loadSummary().then(render);
  loadNeighbors().then(render);
  /* refresh cadences */
  setInterval(function(){ loadAWN(false).then(function(){S.lastTurn=Date.now();render();}).catch(function(e){S.errors.awn=e.message;render();}); }, 120000);
  setInterval(function(){ loadAWN(true).catch(function(){}); }, 900000);
  setInterval(loadNWS, 1800000);
  setInterval(function(){ loadNeighbors().then(render); }, 1800000);
  setInterval(loadAQI, 3600000);
  setInterval(function(){ loadNWS(); }, 300000);
}
boot();
})();
</script>
