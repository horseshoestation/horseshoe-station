name: Build the watch

# Garmin gates device definition files behind an authenticated account, so the
# only way to produce a real signed .prg is to log in. That happens here, with
# credentials you hold as repository secrets, and never on a laptop.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "garmin/**"
      - ".github/workflows/watch.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The prebuilt release, pinned and checksum-verified. (go install put the
      # binary outside the runner's PATH and the build died on command-not-found;
      # a fixed artifact is also faster and cannot drift under us.)
      - name: Install the Connect IQ SDK manager
        run: |
          curl -sSL -o /tmp/ciq.tar.gz \
            https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v0.8.4/connect-iq-sdk-manager-cli_0.8.4_Linux_x86_64.tar.gz
          echo "5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b  /tmp/ciq.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ciq.tar.gz -C /tmp
          sudo install /tmp/connect-iq-sdk-manager /usr/local/bin/connect-iq-sdk-manager

      - name: Fetch the SDK and the epix device files
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager agreement accept \
            --agreement-hash="${{ secrets.CIQ_AGREEMENT_HASH }}"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set '^9'
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
          connect-iq-sdk-manager device download --manifest=garmin/face/manifest.xml
          connect-iq-sdk-manager device download --manifest=garmin/app/manifest.xml

      - name: Unlock the signing key
        run: |
          mkdir -p ~/.ciqkeys
          echo "${{ secrets.CIQ_DEVELOPER_KEY_B64 }}" | base64 -d > ~/.ciqkeys/developer_key.der
          test -s ~/.ciqkeys/developer_key.der

      # -w surfaces warnings, -r builds release (optimised) rather than debug.
      - name: Build the face and the app
        run: |
          set -e
          mkdir -p out
          for p in face app; do
            (cd "garmin/$p" && monkeyc \
              -f monkey.jungle \
              -d epix2 \
              -y ~/.ciqkeys/developer_key.der \
              -o "../../out/horseshoe-$p.prg" \
              -w -r)
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: horseshoe-watch
          path: out/*.prg
          retention-days: 90
