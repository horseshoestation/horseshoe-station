name: Turn the page
on:
  # Kept as a backstop, not as the plan. Measured 2026-07-30: of roughly 620
  # firings requested since the repo went up on 25 July, GitHub delivered about
  # a dozen — call it two percent. Moving to off-round minutes did not help.
  # GitHub's shared cron is best-effort and drops most sub-hourly schedules.
  # The real cadence comes from an external pinger calling workflow_dispatch;
  # see README, "Keeping it on time".
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch: {}
  # Alternative entry point for pingers that find repository_dispatch easier:
  #   curl -X POST -H "Authorization: Bearer $PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/horseshoestation/horseshoe-station/dispatches \
  #     -d '{"event_type":"render"}'
  repository_dispatch:
    types: [render]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # A normal run is about eighty seconds. Without this a single wedged run
    # would sit in the concurrency group for GitHub's default six hours and
    # every firing behind it would be dropped.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet requests pillow playwright
          playwright install --with-deps chromium
      - name: Build pages
        env:
          AWN_API_KEY: ${{ secrets.AWN_API_KEY }}
          AWN_APP_KEY: ${{ secrets.AWN_APP_KEY }}
        run: python renderer/build.py
      # The logbook is recomputed from station history every run, so losing one
      # commit costs nothing. A rejected push must never take the deploy down
      # with it — that would blank the frame over a bookkeeping problem.
      - name: Keep the logbook
        continue-on-error: true
        run: |
          git config user.name "horseshoe-station"
          git config user.email "actions@users.noreply.github.com"
          git add data/logbook.json
          git diff --cached --quiet && exit 0
          git commit -m "logbook: $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing on origin/main (attempt $i)"
            git pull --rebase --autostash origin main || break
          done
          echo "could not push the logbook; the render still deploys"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        uses: actions/deploy-pages@v4
