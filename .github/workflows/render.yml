name: Turn the page
on:
  schedule:
    # Off-round minutes: GitHub's shared cron drops most */10 firings at
    # :00/:10/:20 when every other repo asks for the same slots.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet requests pillow playwright
          playwright install --with-deps chromium
      - name: Build pages
        env:
          AWN_API_KEY: ${{ secrets.AWN_API_KEY }}
          AWN_APP_KEY: ${{ secrets.AWN_APP_KEY }}
        run: python renderer/build.py
      - name: Keep the logbook
        run: |
          git config user.name "horseshoe-station"
          git config user.email "actions@users.noreply.github.com"
          git add data/logbook.json
          git diff --cached --quiet || git commit -m "logbook: $(date -u +%F)"
          git push
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        uses: actions/deploy-pages@v4
